name: Deploy site
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pubblica_statico.py
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _out
          clean: true
